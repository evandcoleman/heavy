name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python3 tests/test_heavyq.py
          python3 tests/test_heavy_top.py
          python3 tests/test_heavy_run.py
      - name: Integration tests
        run: |
          sh tests/integration_heavy_run.sh
          sh tests/integration_queue.sh
      - name: Shell syntax
        run: |
          sh -n bin/heavy && sh -n install.sh
          sh -n tests/integration_heavy_run.sh && sh -n tests/integration_queue.sh
      - name: Smoke test
        run: |
          ./install.sh
          export PATH="$HOME/.local/bin:$PATH"
          test "$(heavy sh -c 'echo hi; exit 3' ; echo "rc=$?")" = "$(printf 'hi\nrc=3')"
          heavy --status
          heavy --top --once
          cmp "$HOME/.local/bin/heavyq.py" bin/heavyq.py
      - name: Link install
        run: |
          PREFIX="$RUNNER_TEMP/link" ./install.sh --link
          test -L "$RUNNER_TEMP/link/bin/heavy-run"
          test -L "$RUNNER_TEMP/link/bin/heavyq.py"
          rc=0; "$RUNNER_TEMP/link/bin/heavy" sh -c 'exit 4' || rc=$?; test "$rc" -eq 4
          "$RUNNER_TEMP/link/bin/heavy" --top --once
      - name: One-line install (piped, downloads this commit)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" \
            | HEAVY_REF=${{ github.sha }} PREFIX="$RUNNER_TEMP/pipe" sh
          cmp "$RUNNER_TEMP/pipe/bin/heavy" bin/heavy
          cmp "$RUNNER_TEMP/pipe/bin/heavy-top" bin/heavy-top
          cmp "$RUNNER_TEMP/pipe/bin/heavy-run" bin/heavy-run
          cmp "$RUNNER_TEMP/pipe/bin/heavyq.py" bin/heavyq.py
          "$RUNNER_TEMP/pipe/bin/heavy" true
